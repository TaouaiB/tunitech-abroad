{% extends 'base.html' %}

{% block title %}Confirm Unsubscribe{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16 max-w-2xl text-center">
    <div class="bg-slate-900 p-8 rounded-2xl shadow-sm border border-slate-800">
        <h1 class="text-3xl font-bold mb-4 text-slate-100">Confirm Unsubscribe</h1>
        <p class="text-slate-400 mb-6">
            Confirm that you want to stop receiving these emails.
        </p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="inline-block px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-500 text-white rounded-xl font-bold hover:opacity-90 transition">
                Unsubscribe
            </button>
        </form>
    </div>
</div>
{% endblock %}
