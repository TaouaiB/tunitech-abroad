{% extends "base.html" %}

{% block title %}404 - TuniAtlas{% endblock %}

{% block content %}
<section class="section">
  <div class="shell">
    <div class="card empty-state" style="text-align:center;">
      <h1 class="code-title">404</h1>

      <h2 class="h2"
          data-fr="Page introuvable"
          data-en="Page not found">
        Page introuvable
      </h2>

      <p class="subtitle"
         style="margin-bottom:16px;"
         data-fr="Cette page n'existe pas ou a été déplacée."
         data-en="This page does not exist or has been moved.">
        Cette page n'existe pas ou a été déplacée.
      </p>

      <a class="btn primary"
         href="{% url 'jobs:list' %}"
         data-fr="Retour aux offres"
         data-en="Back to jobs">
        Retour aux offres
      </a>
    </div>
  </div>
</section>
{% endblock %}
