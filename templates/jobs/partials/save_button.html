{% if user.is_authenticated %}
<div id="save-button-{{ job.public_id }}" style="display:inline-block">
    {% if is_saved %}
        <form method="POST" action="{% url 'jobs:unsave' job.public_id %}" hx-post="{% url 'jobs:unsave' job.public_id %}" hx-target="#save-button-{{ job.public_id }}" hx-swap="outerHTML" style="margin:0;">
            {% csrf_token %}
            <button type="submit" class="btn save saved">
                Sauvegardé
            </button>
        </form>
    {% else %}
        <form method="POST" action="{% url 'jobs:save' job.public_id %}" hx-post="{% url 'jobs:save' job.public_id %}" hx-target="#save-button-{{ job.public_id }}" hx-swap="outerHTML" style="margin:0;">
            {% csrf_token %}
            <button type="submit" class="btn save">
                Sauvegarder
            </button>
        </form>
    {% endif %}
</div>
{% endif %}
