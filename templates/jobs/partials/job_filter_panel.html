<form method="get" action="{% url 'jobs:list' %}" class="filters" id="jobFilterForm">
    <!-- Country: Locked to France -->
    <div class="field">
        <label data-i18n="Country">Pays</label>
        <label class="stat" style="justify-content:flex-start">
            <input type="checkbox" checked disabled> France
        </label>
    </div>

    <!-- Keyword query -->
    <div class="field">
        <label for="side_q" data-i18n="Keywords">Mots-clés</label>
        <input type="text" name="q" id="side_q" value="{{ filters.q|default:'' }}" class="input" placeholder="ex: Python, Django, React">
    </div>

    <!-- Location -->
    <div class="field">
        <label for="side_location" data-i18n="City">Ville</label>
        <input type="text" name="location" id="side_location" value="{{ filters.location|default:'' }}" class="input" placeholder="Paris, Lyon...">
    </div>

    <!-- Remote Type -->
    <div class="field">
        <label for="remote_type" data-i18n="Remote work">Télétravail</label>
        <select id="remote_type" name="remote_type" class="select">
            <option value="" {% if not filters.remote_type %}selected{% endif %} data-i18n="All">Tous</option>
            <option value="remote" {% if filters.remote_type == "remote" %}selected{% endif %}>Remote</option>
            <option value="hybrid" {% if filters.remote_type == "hybrid" %}selected{% endif %} data-i18n="Hybrid">Hybride</option>
            <option value="on_site" {% if filters.remote_type == "on_site" %}selected{% endif %} data-i18n="On site">Sur site</option>
        </select>
    </div>
    <!-- Job Type -->
    <div class="field">
        <label for="job_type" data-i18n="Job type">Type d'emploi</label>
        <select id="job_type" name="job_type" class="select">
            <option value="" {% if not filters.job_type %}selected{% endif %} data-i18n="All">Tous</option>
            <option value="full_time_job" {% if filters.job_type == "full_time_job" %}selected{% endif %} data-i18n="Job">Emploi</option>
            <option value="internship" {% if filters.job_type == "internship" %}selected{% endif %} data-i18n="Internship">Stage</option>
            <option value="apprenticeship" {% if filters.job_type == "apprenticeship" %}selected{% endif %} data-i18n="Apprenticeship">Alternance</option>
            <option value="contract" {% if filters.job_type == "contract" %}selected{% endif %} data-i18n="Freelance / Contract">Freelance / Mission</option>
        </select>
    </div>

    <!-- Experience Level -->
    <div class="field">
        <label for="experience_level" data-i18n="Experience">Expérience</label>
        <select id="experience_level" name="experience_level" class="select">
            <option value="" {% if not filters.experience_level %}selected{% endif %} data-i18n="All levels">Tous niveaux</option>
            <option value="internship" {% if filters.experience_level == "internship" %}selected{% endif %}>Stage</option>
            <option value="junior" {% if filters.experience_level == "junior" %}selected{% endif %}>Junior</option>
            <option value="mid_level" {% if filters.experience_level == "mid_level" %}selected{% endif %}>Confirmé</option>
            <option value="senior" {% if filters.experience_level == "senior" %}selected{% endif %}>Senior</option>
        </select>
    </div>

    <!-- Sort (Hidden input to preserve sort if submitted from here) -->
    {% if sort %}
    <input type="hidden" name="sort" value="{{ sort }}">
    {% endif %}

    <button type="submit" class="btn primary full" data-i18n="Apply filters">Appliquer les filtres</button>
    <a href="{% url 'jobs:list' %}" class="btn secondary full" style="text-align:center" data-i18n="Reset">Réinitialiser</a>
</form>
