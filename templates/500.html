{% extends "base.html" %}

{% block title %}500 - TuniAtlas{% endblock %}

{% block content %}
<section class="section">
  <div class="shell">
    <div class="card empty-state" style="text-align:center;">
      <h1 class="code-title">500</h1>

      <h2 class="h2"
          data-fr="Erreur serveur"
          data-en="Server error">
        Erreur serveur
      </h2>

      <p class="subtitle"
         style="margin-bottom:16px;"
         data-fr="Une erreur est survenue. Réessayez dans un instant."
         data-en="Something went wrong. Please try again in a moment.">
        Une erreur est survenue. Réessayez dans un instant.
      </p>

      <a class="btn primary"
         href="{% url 'jobs:list' %}"
         data-fr="Retour aux offres"
         data-en="Back to jobs">
        Retour aux offres
      </a>
    </div>
  </div>
</section>
{% endblock %}
