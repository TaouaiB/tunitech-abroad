{% extends 'base.html' %}
{% block title %}Recommandations - TuniAtlas{% endblock %}
{% block content %}
<div class="recommendations-v16">
<section class="section">
    <div class="shell">
        <h1 class="page-title small" style="margin-bottom:18px;" data-i18n="Recommendations">Recommandations</h1>
        <form method="post" action="{% url 'recommendations:refresh' %}" style="margin-top:12px;">{% csrf_token %}<button type="submit" class="btn secondary" data-i18n="Refresh my recommendations">Actualiser mes recommandations</button></form>
        <div id="recommendation-panel" style="margin-top:18px;">{% include 'recommendations/partials/recommendation_list.html' with result=result %}</div>
    </div>
</section>
</div>

<script>
/* TUNIATLAS_RECOMMENDATIONS_LOCAL_I18N_V1 */
(function(){
  function currentLang(){
    return localStorage.getItem("ta-lang") || document.documentElement.lang || "fr";
  }

  function actionToEnglish(fr){
    const text = (fr || "").trim();

    const exactMap = {
      "Votre profil est bien aligné avec cette offre. Vérifiez les conditions de mobilité/contrat puis postulez sur la source.": "Your profile is well aligned with this job. Check the mobility/contract conditions, then apply on the source website.",
      "Signal technique insuffisant": "Insufficient technical signal",
      "Expérience non précisée": "Experience not specified",
      "Expérience insuffisante": "Insufficient experience"
    };
    if (exactMap[text]) return exactMap[text];

    const priority = text.match(/^Priorité\s*:\s*ajoutez\s+(.+?)\s+à votre plan d[’']apprentissage\. Mettez à jour votre CV si vous avez déjà utilisé\s+(.+?)\.$/);
    if (priority) {
      const skill = priority[1];
      return `Priority: add ${skill} to your learning plan. Update your CV if you have already used ${skill}.`;
    }

    const signal = text.match(/^Signal technique insuffisant\s*:\s*vérifiez l[’']offre originale avant d[’']interpréter ce score\.$/);
    if (signal) {
      return "Insufficient technical signal: check the original job post before interpreting this score.";
    }

    return text;
  }

  function applyRecommendationI18n(){
    const isEn = currentLang() === "en";

    document.querySelectorAll(".recommendations-v16 .recommendation-i18n").forEach(el => {
      const fr = el.getAttribute("data-fr") || el.textContent.trim();
      let en = el.getAttribute("data-en") || "";
      if (!en || en === fr) en = actionToEnglish(fr);

      el.setAttribute("data-fr", fr);
      el.setAttribute("data-en", en);
      el.textContent = isEn ? en : fr;
    });

    document.querySelectorAll(".recommendations-v16 .job-desc").forEach(desc => {
      Array.from(desc.childNodes).forEach(node => {
        if (node.nodeType !== Node.TEXT_NODE) return;

        const raw = node.nodeValue;
        const trimmed = raw.trim();
        if (!trimmed) return;

        const en = actionToEnglish(trimmed);
        if (en === trimmed && isEn) return;

        const frFromEn = {
          "Insufficient technical signal: check the original job post before interpreting this score.": "Signal technique insuffisant : vérifiez l’offre originale avant d’interpréter ce score."
        };

        const next = isEn ? en : (frFromEn[trimmed] || trimmed);
        if (next !== trimmed) {
          node.nodeValue = raw.replace(trimmed, next);
        }
      });

      desc.querySelectorAll("span").forEach(span => {
        const fr = span.getAttribute("data-fr") || span.textContent.trim();
        let en = span.getAttribute("data-en") || "";
        if (!en || en === fr) en = actionToEnglish(fr);

        if (en !== fr) {
          span.setAttribute("data-fr", fr);
          span.setAttribute("data-en", en);
          span.textContent = isEn ? en : fr;
        }
      });
    });

    document.querySelectorAll(".recommendations-v16 .pill.warn").forEach(pill => {
      const current = pill.textContent.trim();
      const fr = pill.getAttribute("data-fr") || (
        current === "Insufficient technical signal" ? "Signal technique insuffisant" :
        current === "Experience not specified" ? "Expérience non précisée" :
        current === "Insufficient experience" ? "Expérience insuffisante" :
        current
      );
      const en = pill.getAttribute("data-en") || actionToEnglish(fr);

      pill.setAttribute("data-fr", fr);
      pill.setAttribute("data-en", en);
      pill.textContent = isEn ? en : fr;
    });
  }

  document.addEventListener("DOMContentLoaded", function(){
    setTimeout(applyRecommendationI18n, 80);
    setTimeout(applyRecommendationI18n, 300);
  });

  window.addEventListener("load", applyRecommendationI18n);

  document.addEventListener("click", function(e){
    if (e.target.closest("[data-lang-toggle]")) {
      setTimeout(applyRecommendationI18n, 80);
      setTimeout(applyRecommendationI18n, 300);
    }
  });

  document.addEventListener("htmx:afterSwap", applyRecommendationI18n);
})();
</script>

{% endblock %}
