{% extends 'base.html' %}
{% block title %}Recommandations - TuniAtlas{% endblock %}
{% block content %}
<div class="recommendations-v16">
<section class="section">
    <div class="shell">
        <h1 class="page-title small" style="margin-bottom:18px;" data-i18n="Recommendations">Recommandations</h1>
        <form method="post" action="{% url 'recommendations:refresh' %}" style="margin-top:12px;">{% csrf_token %}<button type="submit" class="btn secondary" data-i18n="Refresh my recommendations">Actualiser mes recommandations</button></form>
        <div id="recommendation-panel" style="margin-top:18px;">{% include 'recommendations/partials/recommendation_list.html' with result=result %}</div>
    </div>
</section>
</div>
{% endblock %}
