{% extends 'base.html' %}

{% block title %}Déconnexion - TuniAtlas{% endblock %}

{% block content %}
<section class="section">
  <div class="shell" style="max-width:520px;">
    <form method="post" action="{% url 'account_logout' %}" class="hero-card grid">
      {% csrf_token %}
      <h1 class="page-title small">Déconnexion</h1>
      <p class="muted">Confirmez la déconnexion de votre session.</p>
      <button type="submit" class="btn danger full">Se déconnecter</button>
      <a href="{% url 'jobs:list' %}" class="btn secondary full">Annuler</a>
    </form>
  </div>
</section>
{% endblock %}
