<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject|default:"TuniAtlas" }}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #07111f; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #07111f; width: 100%;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px; width: 100%; background-color: #101f35; border: 1px solid #284263; border-radius: 16px; overflow: hidden; margin: 0 auto;">
          <tr>
            <td style="padding: 32px; text-align: center; border-bottom: 1px solid #284263;">
              <h1 style="margin: 0; font-size: 24px; font-weight: 800; color: #f8fafc; letter-spacing: -0.5px;">TuniAtlas</h1>
              <p style="margin: 8px 0 0 0; color: #b8c4d6; font-size: 14px;">Tech careers abroad for Tunisian talent</p>
            </td>
          </tr>
          <tr>
            <td style="padding: 32px; font-size: 16px; line-height: 1.6; color: #f8fafc;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding: 24px 32px; background-color: #142641; border-top: 1px solid #284263; text-align: center; font-size: 12px; color: #b8c4d6;">
              {% block footer %}
              <p style="margin: 0 0 8px 0;">&copy; {% now "Y" %} TuniAtlas. All rights reserved.</p>
              <p style="margin: 0;">This email was sent to you because you have an account with TuniAtlas.</p>
              {% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
